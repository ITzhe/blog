baseurl: https://www.caizhe.org
locale: en-us
theme: hugo-theme-stack

pagination:
    pagerSize: 5

title: caizhe.org
description: Notes on Linux, Kubernetes, and cloud-native infrastructure.

# 本站为纯英文单语站点。原来的多语言 `languages` 配置块（en / zh-cn / ar）
# 已在中文转英文时整体移除，内容直接放在 content/ 下，不再按语言分子目录。
# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: en

# 如果默认语言是 [zh-cn ja ko]，才需要把 hasCJKLanguage 设为 true，
# 这样 .Summary 和 .WordCount 对中日韩文本的统计才准确。本站是英文，故为 false。
hasCJKLanguage: false

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: logo.ico  # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

    footer:
        since: 2020
        customText:

    # busuanzi（不蒜子）是国内专用的访问量统计服务，标签文字是硬编码中文。
    # 本站已迁到 Cloudflare Pages，故关闭。若以后要面向中文读者再启用，可改为 true。
    busuanzi:
        enable: false
    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        emoji: 🍥
        subtitle: "Simple, honest, and to the point"
        avatar:
            enabled: true
            local: true
            src: img/Bob-log-150x150.jpg

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: true
        provider: disqus

        disqusjs:
            shortname:
            apiUrl:
            apiKey:
            admin:
            adminLabel:

        utterances:
            repo:
            issueTerm: pathname
            label:

        remark42:
            host:
            site:
            locale:

        vssue:
            platform:
            owner:
            repo:
            clientId:
            clientSecret:
            autoCreateIssue: false

        # Waline client configuration see: https://waline.js.org/en/reference/component.html
        waline:
            serverURL:
            lang:
            pageview:
            emoji:
                - https://unpkg.com/@waline/emojis@1.0.1/weibo
            requiredMeta:
                - name
                - email
                - url
            locale:
                admin: Admin
                placeholder:

        twikoo:
            envId:
            region:
            path:
            lang:

        # See https://cactus.chat/docs/reference/web-client/#configuration for description of the various options
        cactus:
            defaultHomeserverUrl: "https://matrix.cactus.chat:8448"
            serverName: "cactus.chat"
            siteName: "" # You must insert a unique identifier here matching the one you registered (See https://cactus.chat/docs/getting-started/quick-start/#register-your-site)

        giscus:
            repo:
            repoID:
            category:
            categoryID:
            mapping:
            lightTheme:
            darkTheme:
            reactionsEnabled: 1
            emitMetadata: 0

        gitalk:
            owner:
            admin:
            repo:
            clientID:
            clientSecret:

        cusdis:
            host:
            id:
    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
#            - type: categories
#              params:
#                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

### Custom menu
### See https://docs.stack.jimmycai.com/configuration/custom-menu.html
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main: []

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/ITzhe/blog
          params:
              icon: brand-github

#        - identifier: twitter
#          name: Twitter
#          url: https://twitter.com
#          params:
#              icon: brand-twitter

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
#        - name: tags
#          weight: 100
#
        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## 是否允许在 Markdown 里写原生 HTML 标签。
            ## 本站设为 true：因为有几篇文章用了原生 <details>、<summary>
            ## 和 <img> 标签（可折叠的配置清单、以及指定尺寸的截图）。
            ## 若改回 false，这些元素会被直接丢弃。
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
